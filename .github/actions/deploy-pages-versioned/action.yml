# Deploy artifact lên GitHub Pages bằng REST API với `pages_build_version` do ta đặt.
#
# Vì sao không dùng actions/deploy-pages@v4: action đó luôn gửi pages_build_version = GITHUB_SHA
# (không có input đổi, GITHUB_* không ghi đè được). GitHub Pages dùng pages_build_version làm khoá
# idempotent: POST lại cùng version → trả deployment cũ, KHÔNG thay artifact. Mọi tag v* đều trỏ vào
# commit đã được deploy-staging xuất bản với đúng SHA đó → phát hành production bị bỏ qua (sự cố
# v2.0.0-rc1). Re-run cùng commit cũng bị bỏ qua. Ở đây version = <ref>-<run_id>-<run_attempt>,
# luôn duy nhất.
#
# Gọi API bằng curl với header GIỐNG HỆT octokit trong deploy-pages (src/internal/api-client.js):
# Accept application/vnd.github.v3+json, Authorization "token", Content-Type application/json, không gửi
# X-GitHub-Api-Version (nếu sau này cần ghim thì dùng 2026-03-10). Mọi lời gọi in HTTP code + body phản
# hồi (không chứa token) để lỗi tự giải thích; lời gọi lỗi in ngoài ::group:: để không bị gập.
#
# Job gọi action này phải có permissions `pages: write` + `id-token: write`, đã checkout repo, và nên
# chạy trong environment github-pages (chính sách nhánh/tag của environment vẫn được áp dụng).
# OIDC token lấy giống @actions/core getIDToken() không tham số (audience mặc định), như deploy-pages.
name: Deploy Pages với build version riêng
description: POST /pages/deployments với pages_build_version tự đặt, poll tới khi succeed

inputs:
  artifact-id:
    description: ID artifact (output artifact_id của actions/upload-pages-artifact)
    required: true
  version:
    description: pages_build_version — phải duy nhất cho mỗi lần deploy
    required: true
  token:
    description: GitHub token
    default: ${{ github.token }}
  timeout-seconds:
    description: Thời gian chờ tối đa (giây) trước khi huỷ deployment
    default: '600'

outputs:
  page_url:
    description: URL site Pages
    value: ${{ steps.create.outputs.page_url }}
  deployment_id:
    description: ID deployment (bằng pages_build_version)
    value: ${{ steps.create.outputs.deployment_id }}

runs:
  using: composite
  steps:
    - name: Tạo Pages deployment
      id: create
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        ARTIFACT_ID: ${{ inputs.artifact-id }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        source "${{ github.action_path }}/api.sh"
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "::error::Không có ACTIONS_ID_TOKEN_REQUEST_URL — job thiếu permission id-token: write."; exit 1
        fi
        # OIDC token (không in ra log). Không thêm audience: giống core.getIDToken() của deploy-pages.
        ID_TOKEN=$(curl -sSf --max-time 30 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          -H "Accept: application/json" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r '.value')
        [ -n "$ID_TOKEN" ] && [ "$ID_TOKEN" != "null" ] || { echo "::error::Không lấy được OIDC token."; exit 1; }
        echo "::add-mask::$ID_TOKEN"

        # Thân request ghi ra file tạm (chứa OIDC, không in), xoá ngay sau khi gọi.
        REQ=$(mktemp)
        jq -n --argjson a "$ARTIFACT_ID" --arg v "$VERSION" --arg t "$ID_TOKEN" \
          '{artifact_id: $a, pages_build_version: $v, oidc_token: $t}' > "$REQ"
        echo "Tạo deployment: artifact_id=$ARTIFACT_ID, pages_build_version=$VERSION"
        if ! api POST "repos/$GITHUB_REPOSITORY/pages/deployments" "$REQ"; then
          rm -f "$REQ"; echo "::error::Tạo Pages deployment thất bại (HTTP $API_CODE) — xem body ở trên."; exit 1
        fi
        rm -f "$REQ"
        DEPLOY_ID=$(jq -r '.id // (.status_url | split("/") | last)' "$API_BODY")
        PAGE_URL=$(jq -r '.page_url' "$API_BODY")
        echo "deployment_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"
        echo "page_url=$PAGE_URL" >> "$GITHUB_OUTPUT"
        {
          echo "### Deploy Pages"
          echo "- pages_build_version: \`$VERSION\`"
          echo "- deployment_id: \`$DEPLOY_ID\` (tạo: HTTP $API_CODE)"
          echo "- artifact_id: \`$ARTIFACT_ID\`"
        } >> "$GITHUB_STEP_SUMMARY"
        echo "Deployment $DEPLOY_ID đã tạo ($PAGE_URL)."

    - name: Chờ deployment hoàn tất
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        DEPLOY_ID: ${{ steps.create.outputs.deployment_id }}
        TIMEOUT: ${{ inputs.timeout-seconds }}
      run: |
        set -euo pipefail
        source "${{ github.action_path }}/api.sh"
        URL="repos/$GITHUB_REPOSITORY/pages/deployments/$DEPLOY_ID"
        START=$(date +%s)
        ERRORS=0
        while :; do
          # Lỗi API tạm thời (mạng, 5xx): bỏ qua tối đa 10 lần liên tiếp như actions/deploy-pages.
          if api GET "$URL"; then
            ERRORS=0; STATUS=$(jq -r '.status' "$API_BODY")
          else
            ERRORS=$((ERRORS + 1)); STATUS="(HTTP $API_CODE, lần $ERRORS)"
            [ "$ERRORS" -lt 10 ] || { echo "::error::Không đọc được trạng thái deployment 10 lần liên tiếp."; exit 1; }
          fi
          echo "Trạng thái: $STATUS"
          case "$STATUS" in
            succeed)
              echo "- kết quả: succeed" >> "$GITHUB_STEP_SUMMARY"; exit 0 ;;
            deployment_failed|deployment_perms_error|deployment_content_failed|deployment_cancelled|deployment_lost)
              echo "- kết quả: **$STATUS**" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Deployment $DEPLOY_ID thất bại: $STATUS"; exit 1 ;;
          esac
          if [ $(( $(date +%s) - START )) -ge "$TIMEOUT" ]; then
            api POST "$URL/cancel" || true
            echo "- kết quả: **quá $TIMEOUT giây, đã huỷ**" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Deployment $DEPLOY_ID quá $TIMEOUT giây — đã gửi huỷ."; exit 1
          fi
          sleep 5
        done
