# Build frontend/ bằng Vite và đưa lên GitHub Pages qua actions/deploy-pages.
#
# Chỉ deploy khi Settings → Pages → Source đã là "GitHub Actions" (build_type = workflow).
# Khi Source còn là "Deploy from a branch" (bản index.html cũ ở gốc repo), job build vẫn chạy
# để kiểm tra, còn job deploy bị bỏ qua — bản cũ tiếp tục hoạt động cho tới khi chủ dự án
# tự chuyển Source. Có thể ép deploy bằng workflow_dispatch (force_deploy = true).
#
# Secrets cần có (Settings → Secrets and variables → Actions):
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY — project production (chỉ anon key).
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: Deploy ngay cả khi chưa kiểm tra được nguồn Pages
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Vite
    runs-on: ubuntu-latest
    outputs:
      pages_build_type: ${{ steps.pages.outputs.build_type }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Kiểm tra secrets
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::Thiếu secret VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - name: Cài phụ thuộc
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - name: Đọc nguồn Pages hiện tại
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TYPE=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo unknown)
          echo "Nguồn Pages: $TYPE"
          echo "build_type=$TYPE" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy Pages
    needs: build
    if: needs.build.outputs.pages_build_type == 'workflow' || inputs.force_deploy == true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
