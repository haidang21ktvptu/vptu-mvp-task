name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  gitleaks:
    name: Quét rò rỉ bí mật
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  supabase-db:
    name: Áp migration + lint schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Khởi động Supabase cục bộ (tự áp toàn bộ migrations)
        run: supabase start
      - name: Lint schema
        run: supabase db lint --local --fail-on error

  frontend:
    name: Build frontend + giới hạn 300 dòng
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cài phụ thuộc
        working-directory: frontend
        run: npm ci
      - name: Build (giá trị giả, chỉ kiểm tra build được)
        working-directory: frontend
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
        run: npm run build
      - name: Không file nào trên 300 dòng
        run: node scripts/check-line-limit.mjs
