name: CI

# pull_request không giới hạn nhánh đích để PR xếp chồng (feature → feature) vẫn được kiểm tra.
# Job "Kiểm thử RLS + e2e trên staging" chỉ chạy cho pull_request (không chạy khi push main để không
# chen vào deploy-staging đang áp migration). Secrets cần có: xem docs/kien-truc.md.
on:
  pull_request:
  push:
    branches: [main]

# shell: bash để bật pipefail — lỗi trong lệnh trước dấu | (db dump, db push --dry-run) không bị nuốt.
defaults:
  run:
    shell: bash

jobs:
  gitleaks:
    name: Quét rò rỉ bí mật
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Repo public: file Excel/CSV/PDF chứa dữ liệu thật (họ tên cán bộ, nội dung KL BTVTU) không được commit
      # (docs/thiet-ke-theo-doi-kl-btvtu.md mục 2.4b). Gitleaks bỏ qua các đuôi này theo allowlist mặc định
      # nên kiểm riêng bằng git ls-files.
      - name: Không có file dữ liệu thật (.xlsx/.xls/.csv/.pdf) trong repo
        run: |
          if git ls-files | grep -Ei '\.(xlsx|xlsm|xls|csv|pdf)$'; then
            echo "::error::Repo public — không commit file Excel/CSV/PDF chứa dữ liệu thật; để ngoài repo (vptu-backup/nguon-kl-btvtu)."
            exit 1
          fi
          echo "Đạt: không có file dữ liệu thật."

  supabase-db:
    name: Áp migration + lint schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Khởi động Supabase cục bộ (tự áp toàn bộ migrations)
        run: supabase start
      - name: Lint schema
        run: supabase db lint --local --fail-on error
      # Test RLS trên Postgres cục bộ vừa áp migration của chính PR (staging chỉ có schema đã merge);
      # không tốn lượt đăng nhập Supabase Auth hosted. seed.sql đã tạo sẵn auth user. Node 24 vì
      # `node --test --test-isolation=none` cần Node >= 23.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            tests/rls/package-lock.json
            scripts/package-lock.json
      # Nạp bộ dữ liệu vàng ẩn danh (185 dòng, GĐ8 PR 8B) để test mốc kl-moc-2026-09-14 chạy thật trên Postgres cục bộ
      # với migration của chính PR — không chỉ trên staging.
      - name: Nạp bộ dữ liệu vàng KL BTVTU vào Supabase cục bộ
        run: |
          npm ci --prefix scripts
          node scripts/nhap-kl-btvtu.mjs --file tests/rls/du-lieu-vang/kl-btvtu.json --local --ghi
      - name: Test RLS trên Supabase cục bộ (migration của PR)
        working-directory: tests/rls
        env:
          RLS_LOCAL: '1'
        run: npm ci && npm test

  frontend:
    name: Build frontend + giới hạn 300 dòng
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            package-lock.json
      - name: Cài phụ thuộc
        working-directory: frontend
        run: npm ci
      - name: Build (giá trị giả, chỉ kiểm tra build được)
        working-directory: frontend
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
        run: npm run build
      - name: Unit test module thuần KL (frontend/tests, node:test)
        working-directory: frontend
        run: npm test
      - name: ESLint (frontend/src, frontend/tests, tests/e2e, scripts)
        run: npm ci && npm run lint
      - name: Không file nào trên 300 dòng
        run: node scripts/check-line-limit.mjs

  # RLS (101 test local / 99 staging, 7 lượt đăng nhập) rồi e2e (33 test, 8 lượt) chạy nối tiếp trong MỘT job — cùng một
  # IP runner, tổng 15 lượt đăng nhập, dưới giới hạn 30 lượt/5 phút/IP của Supabase Auth. Nhóm
  # concurrency để hai PR không cùng lúc ghi dữ liệu mẫu lên staging (không huỷ lượt đang chạy).
  kiem-thu-staging:
    name: Kiểm thử RLS + e2e trên staging
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: kiem-thu-staging
      cancel-in-progress: false
    env:
      SUPABASE_URL: https://vojmrjezspdftovzinek.supabase.co
      SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/rls/package-lock.json
            tests/e2e/package-lock.json
      - name: Kiểm tra secrets staging
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Thiếu secret STAGING_SUPABASE_ANON_KEY / STAGING_SUPABASE_SERVICE_ROLE_KEY (xem docs/kien-truc.md)."
            exit 1
          fi
      - name: Cài phụ thuộc (frontend, tests/rls, tests/e2e)
        run: |
          npm ci --prefix frontend
          npm ci --prefix tests/rls
          npm ci --prefix tests/e2e
      - name: Test RLS (token thật, 7 tài khoản seed)
        working-directory: tests/rls
        run: npm test
      - name: Cài Chromium cho Playwright
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium
      - name: Test e2e (build Vite trỏ staging, 2 kích thước, phiên dùng lại)
        working-directory: tests/e2e
        run: npm test
      - name: Lưu báo cáo Playwright khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7
