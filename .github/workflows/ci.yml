name: CI

# pull_request không giới hạn nhánh đích để PR xếp chồng (feature → feature) vẫn được kiểm tra.
# Job "Kiểm thử RLS + e2e trên staging" chỉ chạy cho pull_request (không chạy khi push main để không
# chen vào deploy-staging đang áp migration). Secrets cần có: xem docs/kien-truc.md.
#
# PR chỉ tài liệu (mọi file đổi khớp `docs/**` hoặc `*.md`, job `phan-loai`): hai job chậm
# `supabase-db` và `kiem-thu-staging` được thay bằng job rỗng CÙNG TÊN hiển thị để ruleset `main`
# (bắt buộc 4 check theo tên) vẫn xanh. Không chắc là docs-only (push main, diff lỗi, PR rỗng) → chạy đủ.
# `gitleaks` và `frontend` luôn chạy. Test RLS bằng token thật trên staging đã chuyển sang
# deploy-staging.yml (chạy sau db push); trong PR, RLS chạy trên Supabase cục bộ ở `supabase-db`.
on:
  pull_request:
  push:
    branches: [main]

# shell: bash để bật pipefail — lỗi trong lệnh trước dấu | (db dump, db push) không bị nuốt.
defaults:
  run:
    shell: bash

jobs:
  gitleaks:
    name: Quét rò rỉ bí mật
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Repo public: file Excel/CSV/PDF chứa dữ liệu thật (họ tên cán bộ, nội dung KL BTVTU) không được commit
      # (docs/thiet-ke-theo-doi-kl-btvtu.md mục 2.4b). Gitleaks bỏ qua các đuôi này theo allowlist mặc định
      # nên kiểm riêng bằng git ls-files.
      - name: Không có file dữ liệu thật (.xlsx/.xls/.csv/.pdf) trong repo
        run: |
          if git ls-files | grep -Ei '\.(xlsx|xlsm|xls|csv|pdf)$'; then
            echo "::error::Repo public — không commit file Excel/CSV/PDF chứa dữ liệu thật; để ngoài repo (vptu-backup/nguon-kl-btvtu)."
            exit 1
          fi
          echo "Đạt: không có file dữ liệu thật."

  # Phân loại PR: docs_only = 'true' chỉ khi danh sách file của PR đọc được (API), có ít nhất một file và
  # KHÔNG file nào ngoài `docs/**` / `*.md`. Nhánh phát hành (`*phat-hanh*`) luôn 'false': commit đầu nhánh
  # đó được gắn tag `v*` và `deploy-prod` (job kiem-tra) chỉ tin 4 check của đúng commit ấy, mà push main
  # không chạy e2e — nên PR phát hành phải chạy đủ dù chỉ đổi tài liệu. Mọi lỗi → 'false'; job không đọc
  # mã nguồn (không checkout) và không bao giờ đỏ. Chỉ chạy cho pull_request; khi bị bỏ qua (push main)
  # output rỗng → các job dưới (điều kiện `!cancelled()` + `!= 'true'`) vẫn chạy đủ.
  phan-loai:
    name: Phân loại PR (chỉ tài liệu?)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.xet.outputs.docs_only }}
    steps:
      - id: xet
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SO_PR: ${{ github.event.pull_request.number }}
          NHANH: ${{ github.head_ref }}
        run: |
          KQ=false
          FILES=$(gh api "repos/$REPO/pulls/$SO_PR/files" --paginate --jq '.[].filename' 2>/dev/null || true)
          NGOAI=$(printf '%s\n' "$FILES" | grep -Ev '^docs/|\.md$' || true)
          case "$NHANH" in *phat-hanh*) NGOAI="(nhánh phát hành — luôn chạy đủ)";; esac
          if [ -n "$FILES" ] && [ -z "$NGOAI" ]; then KQ=true; fi
          echo "docs_only=$KQ" >> "$GITHUB_OUTPUT"
          echo "docs_only=$KQ"
          printf 'File đổi:\n%s\nNgoài docs/*.md:\n%s\n' "${FILES:-(không đọc được)}" "${NGOAI:-(không có)}"

  supabase-db:
    name: Áp migration + lint schema
    needs: phan-loai
    if: ${{ !cancelled() && needs.phan-loai.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Khởi động Supabase cục bộ (tự áp toàn bộ migrations)
        run: supabase start
      - name: Lint schema
        run: supabase db lint --local --fail-on error
      # Test RLS trên Postgres cục bộ vừa áp migration của chính PR (staging chỉ có schema đã merge);
      # không tốn lượt đăng nhập Supabase Auth hosted. seed.sql đã tạo sẵn auth user. Node 24 vì
      # `node --test --test-isolation=none` cần Node >= 23.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            tests/rls/package-lock.json
            scripts/package-lock.json
      # Nạp bộ dữ liệu vàng ẩn danh (185 dòng, GĐ8 PR 8B) để test mốc kl-moc-2026-09-14 chạy thật trên Postgres cục bộ
      # với migration của chính PR — không chỉ trên staging.
      - name: Nạp bộ dữ liệu vàng KL BTVTU vào Supabase cục bộ
        run: |
          npm ci --prefix scripts
          node scripts/nhap-kl-btvtu.mjs --file tests/rls/du-lieu-vang/kl-btvtu.json --local --ghi
      - name: Test RLS trên Supabase cục bộ (migration của PR)
        working-directory: tests/rls
        env:
          RLS_LOCAL: '1'
        run: npm ci && npm test

  # Job rỗng cùng tên hiển thị với `supabase-db`, chỉ cho PR docs-only (ruleset bắt check theo tên).
  supabase-db-tai-lieu:
    name: Áp migration + lint schema
    needs: phan-loai
    if: ${{ !cancelled() && needs.phan-loai.outputs.docs_only == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "PR chỉ tài liệu — bỏ qua áp migration, lint schema và test RLS cục bộ."

  frontend:
    name: Build frontend + giới hạn 300 dòng
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            package-lock.json
      - name: Cài phụ thuộc
        working-directory: frontend
        run: npm ci
      - name: Build (giá trị giả, chỉ kiểm tra build được)
        working-directory: frontend
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
        run: npm run build
      - name: Unit test module thuần KL (frontend/tests, node:test)
        working-directory: frontend
        run: npm test
      - name: ESLint (frontend/src, frontend/tests, tests/e2e, scripts)
        run: npm ci && npm run lint
      - name: Không file nào trên 300 dòng
        run: node scripts/check-line-limit.mjs

  # e2e (43 test, 8 lượt đăng nhập) trên staging. RLS bằng token thật đã chuyển sang deploy-staging.yml
  # (chạy sau db push); trong PR, RLS chạy cục bộ ở `supabase-db` với migration của chính PR. 8 lượt
  # đăng nhập/lần, dưới giới hạn 30 lượt/5 phút/IP của Supabase Auth. Nhóm concurrency để hai PR không
  # cùng lúc ghi dữ liệu mẫu lên staging (không huỷ lượt đang chạy). Giữ tên hiển thị cũ vì ruleset `main`
  # bắt check theo tên.
  # Công tắc môi trường kiểm thử (docs/KIEM-THU.md): biến kho vars.KIEM_THU_MOI_TRUONG = 'staging' (mặc định) | 'production'.
  # production: db push migration lên project production, nạp tài khoản demo (scripts/seed-demo.mjs, idempotent) rồi CHỈ e2e (không RLS token thật).
  # Tên job giữ nguyên vì ruleset của main yêu cầu check này; Summary ghi rõ môi trường.
  kiem-thu-staging:
    name: Kiểm thử RLS + e2e trên staging
    needs: phan-loai
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.phan-loai.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: kiem-thu-${{ vars.KIEM_THU_MOI_TRUONG || 'staging' }}
      cancel-in-progress: false
    env:
      KIEM_THU_MOI_TRUONG: ${{ vars.KIEM_THU_MOI_TRUONG || 'staging' }}
      PROJECT_REF: ${{ vars.KIEM_THU_MOI_TRUONG == 'production' && 'frwyxcmbonjaimziiuqr' || 'vojmrjezspdftovzinek' }}
      SUPABASE_URL: ${{ vars.KIEM_THU_MOI_TRUONG == 'production' && 'https://frwyxcmbonjaimziiuqr.supabase.co' || 'https://vojmrjezspdftovzinek.supabase.co' }}
      SUPABASE_ANON_KEY: ${{ vars.KIEM_THU_MOI_TRUONG == 'production' && secrets.VITE_SUPABASE_ANON_KEY || secrets.STAGING_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ vars.KIEM_THU_MOI_TRUONG == 'production' && secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/e2e/package-lock.json
      - name: Môi trường kiểm thử
        run: |
          echo "### Môi trường kiểm thử: **$KIEM_THU_MOI_TRUONG** (project \`$PROJECT_REF\`)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$KIEM_THU_MOI_TRUONG" = production ]; then
            echo "production: chỉ e2e (db push + tài khoản demo + e2e; bỏ RLS token thật — bộ RLS giả định seed staging, RLS đã chạy ở job cục bộ)." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -z "$SUPABASE_ANON_KEY" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Thiếu secret anon/service_role cho môi trường $KIEM_THU_MOI_TRUONG (staging: STAGING_SUPABASE_*; production: VITE_SUPABASE_ANON_KEY + SUPABASE_SERVICE_ROLE_KEY)."
            exit 1
          fi
      - name: Cài phụ thuộc (frontend, tests/e2e)
        run: |
          npm ci --prefix frontend
          npm ci --prefix tests/e2e
      # ---- Chỉ khi KIEM_THU_MOI_TRUONG = production: migration → tài khoản demo (staging: migration do deploy-staging.yml, RLS ở đó) ----
      - uses: supabase/setup-cli@v1
        if: env.KIEM_THU_MOI_TRUONG == 'production'
        with:
          version: latest
      - name: db push migration lên production (công tắc kiểm thử)
        if: env.KIEM_THU_MOI_TRUONG == 'production'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Thiếu secret SUPABASE_ACCESS_TOKEN / PROD_DB_PASSWORD ở cấp kho (job này không dùng environment production)."
            exit 1
          fi
          supabase db push --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD" --yes 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" # push thật, kết quả vào Summary (không dry-run: dễ đọc nhầm là chưa áp)
      - name: Nạp tài khoản demo (idempotent, không chạm dữ liệu thật)
        if: env.KIEM_THU_MOI_TRUONG == 'production'
        run: |
          npm ci --prefix scripts
          node scripts/seed-demo.mjs 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      # KHÔNG chạy RLS token thật trên production: bộ RLS giả định seed của staging (id cố định, phân công demo, tổng số dòng, không ai có
      # quan_tri_kl) nên đỏ hàng loạt trên dữ liệu thật dù mã đúng; RLS đã chạy đủ trên Supabase cục bộ ở job "Áp migration + lint schema".
      # production: chỉ db push → tài khoản demo → e2e (docs/KIEM-THU.md).
      # Cache Chromium theo phiên bản @playwright/test trong lock file; trúng cache thì chỉ cài gói hệ thống.
      # Lưu cache ngay sau khi cài xong (restore/save tách) để lần chạy e2e đỏ vẫn để lại cache cho lần re-run.
      - name: Phiên bản Playwright
        id: pw
        run: echo "version=$(node -p "require('./tests/e2e/package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - name: Khôi phục cache Chromium của Playwright
        id: pw-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Cài Chromium cho Playwright (khi chưa có cache)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium
      - name: Lưu cache Chromium (khi vừa cài)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Cài gói hệ thống cho Chromium (khi đã có cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: tests/e2e
        run: npx playwright install-deps chromium
      - name: Test e2e (build Vite trỏ môi trường kiểm thử, 2 kích thước, phiên dùng lại)
        working-directory: tests/e2e
        run: npm test
      - name: Lưu báo cáo Playwright khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7

  # Job rỗng cùng tên hiển thị với `kiem-thu-staging`, chỉ cho PR docs-only.
  kiem-thu-staging-tai-lieu:
    name: Kiểm thử RLS + e2e trên staging
    needs: phan-loai
    if: ${{ !cancelled() && needs.phan-loai.outputs.docs_only == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "PR chỉ tài liệu — bỏ qua e2e trên staging."
