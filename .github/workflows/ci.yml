name: CI

# pull_request không giới hạn nhánh đích để PR xếp chồng (feature → feature) vẫn được kiểm tra. Job "Kiểm thử RLS + e2e trên staging" chỉ chạy
# cho pull_request (không chen vào deploy-staging đang áp migration khi push main). Secrets cần có: xem docs/kien-truc.md.
# Phân loại thay đổi (job `phan-loai`, script dùng chung .github/scripts/phan-loai.sh — cùng deploy-staging.yml), cho cả pull_request và push
# main: mọi file đổi khớp `docs/**`, `*.md`, workflows backup-dinh-ky / canh-bao → "không ảnh hưởng app": ba job `supabase-db`, `frontend`,
# `kiem-thu-staging` thay bằng job rỗng CÙNG TÊN hiển thị (ruleset `main` bắt 4 check theo tên; deploy-prod `kiem-tra` cũng đọc theo tên nên PR
# release chỉ tài liệu vẫn tag được). `gitleaks` luôn chạy. Không chắc (PR rỗng, API lỗi, lấy không đủ danh sách, push đầu tiên) hoặc đổi chính
# script / ci.yml / deploy-*.yml → chạy đủ. Trong PR, RLS và e2e đều chạy trên Supabase cục bộ của runner (v3.18); staging: smoke sau merge
# (deploy-staging.yml), bộ đủ + RLS token thật mỗi đêm (kiem-thu-dem.yml).
on:
  pull_request:
  push:
    branches: [main]

# PR: lượt CI mới trên cùng nhánh huỷ lượt cũ đang chạy (push liên tiếp không xếp hàng); push main: mỗi sha một nhóm, không huỷ.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# shell: bash để bật pipefail — lỗi trong lệnh trước dấu | (db dump, db push) không bị nuốt.
defaults:
  run:
    shell: bash

jobs:
  gitleaks:
    name: Quét rò rỉ bí mật
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Repo public: file Excel/CSV/PDF chứa dữ liệu thật (họ tên cán bộ, nội dung KL BTVTU) không được commit
      # (docs/thiet-ke-theo-doi-kl-btvtu.md mục 2.4b). Gitleaks bỏ qua các đuôi này theo allowlist mặc định
      # nên kiểm riêng bằng git ls-files.
      - name: Không có file dữ liệu thật (.xlsx/.xls/.csv/.pdf) trong repo
        run: |
          if git ls-files | grep -Ei '\.(xlsx|xlsm|xls|csv|pdf)$'; then
            echo "::error::Repo public — không commit file Excel/CSV/PDF chứa dữ liệu thật; để ngoài repo (vptu-backup/nguon-kl-btvtu)."
            exit 1
          fi
          echo "Đạt: không có file dữ liệu thật."

  # Phân loại thay đổi: chạy cho cả pull_request và push main; chỉ checkout thư mục script (sparse), quyền tối thiểu; không bao giờ đỏ
  # (script luôn exit 0, mọi lỗi → 'false' = chạy đủ). Các job dưới dùng `!cancelled()` để không bị bỏ qua theo job này.
  phan-loai:
    name: Phân loại thay đổi (không ảnh hưởng app?)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      khong_anh_huong_app: ${{ steps.xet.outputs.khong_anh_huong_app }}
      cham_function: ${{ steps.xet.outputs.cham_function }}
      cham_migration: ${{ steps.xet.outputs.cham_migration }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
      - id: xet
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SO_PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: bash .github/scripts/phan-loai.sh

  supabase-db:
    name: Áp migration + lint schema
    needs: phan-loai
    if: ${{ !cancelled() && needs.phan-loai.outputs.khong_anh_huong_app != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Khởi động Supabase cục bộ (tự áp toàn bộ migrations)
        run: supabase start
      - name: Lint schema
        run: supabase db lint --local --fail-on error
      # Test RLS trên Postgres cục bộ vừa áp migration của chính PR (staging chỉ có schema đã merge); không tốn lượt đăng nhập Supabase Auth
      # hosted. seed.sql đã tạo sẵn auth user. Node 24 vì `node --test --test-isolation=none` cần Node >= 23.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            tests/rls/package-lock.json
            scripts/package-lock.json
      # Nạp bộ dữ liệu vàng ẩn danh (185 dòng, GĐ8 PR 8B) để test mốc kl-moc-2026-09-14 chạy thật trên Postgres cục bộ với migration của chính PR.
      - name: Nạp bộ dữ liệu vàng KL BTVTU vào Supabase cục bộ
        run: |
          npm ci --prefix scripts
          node scripts/nhap-kl-btvtu.mjs --file tests/rls/du-lieu-vang/kl-btvtu.json --local --ghi
      - name: Test RLS trên Supabase cục bộ (migration của PR)
        working-directory: tests/rls
        env:
          RLS_LOCAL: '1'
        run: npm ci && npm test 2>&1 | tee "$RUNNER_TEMP/rls.log"   # pipefail: mã thoát là của npm test
      - name: Chú thích test RLS đỏ (đọc được qua API check-runs)
        if: failure()
        run: bash scripts/rls-chu-thich.sh "$RUNNER_TEMP/rls.log"
  # Job rỗng cùng tên hiển thị với `supabase-db`, chỉ khi thay đổi không ảnh hưởng app / PR docs-only (ruleset bắt check theo tên).
  supabase-db-tai-lieu:
    name: Áp migration + lint schema
    needs: phan-loai
    if: ${{ !cancelled() && needs.phan-loai.outputs.khong_anh_huong_app == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Thay đổi không ảnh hưởng app — bỏ qua áp migration, lint schema và test RLS cục bộ."

  # Job rỗng cùng tên hiển thị với `frontend`, chỉ khi thay đổi không ảnh hưởng app.
  frontend-tai-lieu:
    name: Build frontend + giới hạn 300 dòng
    needs: phan-loai
    if: ${{ !cancelled() && needs.phan-loai.outputs.khong_anh_huong_app == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Thay đổi không ảnh hưởng app — bỏ qua build, unit test, lint và giới hạn 300 dòng."

  frontend:
    name: Build frontend + giới hạn 300 dòng
    needs: phan-loai
    if: ${{ !cancelled() && needs.phan-loai.outputs.khong_anh_huong_app != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            package-lock.json
      - name: Cài phụ thuộc
        working-directory: frontend
        run: npm ci
      - name: Build (giá trị giả, chỉ kiểm tra build được)
        working-directory: frontend
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
        run: npm run build
      - name: Unit test module thuần KL (frontend/tests, node:test)
        working-directory: frontend
        run: npm test
      - name: ESLint (frontend/src, frontend/tests, tests/e2e, scripts)
        run: npm ci && npm run lint
      - name: Không file nào trên 300 dòng
        run: node scripts/check-line-limit.mjs

  # v3.18: e2e của PR chạy trên Supabase CỤC BỘ của runner (như RLS ở `supabase-db`): staging gói nhỏ dùng chung với kiểm tay nên e2e cả bộ
  # hay chạm statement timeout / danh sách không kịp làm mới (#117 đỏ 3 lần ở 3 spec khác nhau). Cục bộ: ~3 phút, không phụ thuộc staging,
  # không tốn lượt đăng nhập Auth hosted. Bộ đủ trên staging chạy mỗi đêm + khi phát hành (kiem-thu-dem.yml); staging sau merge chỉ smoke
  # (deploy-staging.yml). Tên job giữ nguyên vì ruleset `main` bắt check theo tên; Summary ghi rõ đích. Công tắc vars.KIEM_THU_MOI_TRUONG =
  # 'production' (docs/KIEM-THU.md) vẫn như cũ: db push migration lên production, nạp tài khoản demo rồi e2e trên production (không RLS token thật).
  kiem-thu-staging:
    name: Kiểm thử RLS + e2e trên staging
    needs: phan-loai
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.phan-loai.outputs.khong_anh_huong_app != 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: kiem-thu-${{ vars.KIEM_THU_MOI_TRUONG == 'production' && 'production' || github.head_ref }}   # cục bộ: không tranh tài nguyên giữa các PR
      cancel-in-progress: false
    env:
      KIEM_THU_MOI_TRUONG: ${{ vars.KIEM_THU_MOI_TRUONG || 'staging' }}
      PROJECT_REF: frwyxcmbonjaimziiuqr
      SUPABASE_URL: ${{ vars.KIEM_THU_MOI_TRUONG == 'production' && 'https://frwyxcmbonjaimziiuqr.supabase.co' || '' }}
      SUPABASE_ANON_KEY: ${{ vars.KIEM_THU_MOI_TRUONG == 'production' && secrets.VITE_SUPABASE_ANON_KEY || '' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ vars.KIEM_THU_MOI_TRUONG == 'production' && secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      # ---- Mặc định: Supabase cục bộ (migration của chính PR) + seed.sql + bộ dữ liệu vàng + tài khoản / dữ liệu mẫu e2e (seed-demo, idempotent) ----
      - name: Supabase cục bộ + dữ liệu kiểm thử
        if: env.KIEM_THU_MOI_TRUONG != 'production'
        run: |
          echo "### Môi trường kiểm thử: **Supabase cục bộ trên runner** (migration của PR; staging không bị chạm)" >> "$GITHUB_STEP_SUMMARY"
          supabase start
          npm ci --prefix scripts
          node scripts/nhap-kl-btvtu.mjs --file tests/rls/du-lieu-vang/kl-btvtu.json --local --ghi
          eval "$(supabase status -o env | grep -E '^(API_URL|SERVICE_ROLE_KEY|SECRET_KEY)=')"
          SUPABASE_URL="$API_URL" SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:-$SECRET_KEY}" node scripts/seed-demo.mjs 2>&1 | tail -n 15
      # ---- Chỉ khi KIEM_THU_MOI_TRUONG = production: db push → tài khoản demo → e2e trên production ----
      - name: db push migration lên production + tài khoản demo (công tắc kiểm thử)
        if: env.KIEM_THU_MOI_TRUONG == 'production'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
        run: |
          echo "### Môi trường kiểm thử: **production** (công tắc) — chỉ e2e, không RLS token thật" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_ANON_KEY" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Thiếu secret SUPABASE_ACCESS_TOKEN / PROD_DB_PASSWORD / VITE_SUPABASE_ANON_KEY / SUPABASE_SERVICE_ROLE_KEY ở cấp kho."; exit 1
          fi
          supabase link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"   # runner không có IPv6 → pooler IPv4 (6/10/2026)
          supabase db push --linked -p "$SUPABASE_DB_PASSWORD" --yes 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          npm ci --prefix scripts
          node scripts/seed-demo.mjs 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/e2e-playwright
        with:
          dich: ${{ env.KIEM_THU_MOI_TRUONG == 'production' && 'production' || 'local' }}
          workers: '2'

  # Job rỗng cùng tên hiển thị với `kiem-thu-staging`, chỉ cho pull_request khi thay đổi không ảnh hưởng app.
  kiem-thu-staging-tai-lieu:
    name: Kiểm thử RLS + e2e trên staging
    needs: phan-loai
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.phan-loai.outputs.khong_anh_huong_app == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Thay đổi không ảnh hưởng app — bỏ qua e2e trên staging."
