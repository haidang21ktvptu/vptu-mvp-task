# Phát hành production khi đẩy tag v* (ví dụ v2.0.0-rc2). Tag phải gắn lên COMMIT ĐẦU NHÁNH PHÁT HÀNH
# (PR đã CI xanh, CHƯA merge): GitHub Pages bắt pages_build_version = sha của commit chạy workflow, mỗi sha
# chỉ deploy được một lần (kết luận chẩn đoán GĐ6, sự cố rc1) — commit đã lên main thì deploy-staging đã
# deploy sha đó rồi. Merge PR (merge commit) sau khi phát hành xong. Thứ tự:
#   1. `kiem-tra` (không cần duyệt): CI của commit tag phải xanh đủ 4 check; sha chưa có Pages deployment.
#   2. `phat-hanh` (environment "production", CHỜ NGƯỜI DUYỆT haidang21ktvptu):
#      backup pg_dump production (mã hoá, lưu artifact 90 ngày) → supabase db push production
#      → build hai bản frontend (production từ tag, staging từ main).
#   3. `deploy`: actions/deploy-pages@v4 (migration đã xong TRƯỚC — bài học GĐ1).
#   4. `smoke`: đợi bản mới lan tới Pages, đăng nhập 1 tài khoản bằng Playwright; đạt thì gắn tag
#      `production` vào commit vừa phát hành (deploy-staging dùng tag này để build lại bản production).
#   5. `quay-lui`: chỉ chạy khi có bước lỗi — ghi hướng dẫn quay lui vào Summary.
# Không có workflow_dispatch: production luôn = một tag v*. Quay lui = nhánh mới từ commit cũ + commit rỗng
# + tag v* mới (sha cũ đã deploy nên tag lại không có tác dụng — xem docs/kien-truc.md). Cấu hình Auth
# (supabase config push) vẫn làm tay sau khi trình diff.
#
# Secrets: repository — SUPABASE_ACCESS_TOKEN, VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY,
# STAGING_SUPABASE_ANON_KEY, SMOKE_USERNAME, SMOKE_PASSWORD; environment "production" —
# PROD_DB_PASSWORD, BACKUP_PASSPHRASE. Chi tiết: docs/kien-truc.md.
name: Deploy production

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  pages: write
  id-token: write
  checks: read # đọc check-runs của commit tag (job kiem-tra)

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PROD_REF: frwyxcmbonjaimziiuqr
  STAGING_URL: https://vojmrjezspdftovzinek.supabase.co
  LIVE_URL: https://haidang21ktvptu.github.io/vptu-mvp-task/

# shell: bash để bật pipefail — lỗi trong lệnh trước dấu | (db dump, db push --dry-run) không bị nuốt.
defaults:
  run:
    shell: bash

jobs:
  # Chạy TRƯỚC bước duyệt để tag sai bị chặn sớm, không tốn một lượt duyệt.
  kiem-tra:
    name: Kiểm tra tag (CI xanh, sha chưa deploy Pages)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: CI của commit ${{ github.sha }} phải xanh đủ 4 check bắt buộc
        run: |
          RUNS=$(mktemp)
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" > "$RUNS"
          echo "Check-runs của commit:"; jq -r '.check_runs[] | "  \(.name): \(.status)/\(.conclusion)"' "$RUNS"
          FAIL=0
          for NAME in "Quét rò rỉ bí mật" "Áp migration + lint schema" "Build frontend + giới hạn 300 dòng" "Kiểm thử RLS + e2e trên staging"; do
            OK=$(jq -r --arg n "$NAME" '[.check_runs[] | select(.name == $n and .conclusion == "success")] | length' "$RUNS")
            if [ "$OK" = "0" ]; then echo "::error::Check \"$NAME\" chưa xanh trên commit này (chưa mở PR hoặc CI chưa xong/đỏ)."; FAIL=1; fi
          done
          [ "$FAIL" = 0 ] || exit 1
          echo "CI xanh đủ 4 check."
      - name: Commit chưa từng deploy Pages (nếu đã deploy, Pages sẽ bỏ qua bản mới)
        run: |
          # Không phải hợp đồng API: quan sát GET /pages/deployments/<sha> trả 200 với status rỗng khi chưa có,
          # 200 với status có giá trị khi đã có. In HTTP code + body và chỉ cho qua đúng dạng "200 + status rỗng";
          # mọi dạng khác DỪNG (cho qua nhầm sẽ tái diễn sự cố rc1).
          BODY=$(mktemp)
          CODE=$(curl -sS --max-time 60 -o "$BODY" -w '%{http_code}' -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages/deployments/$GITHUB_SHA") || CODE=000
          echo "GET /pages/deployments/$GITHUB_SHA → HTTP $CODE"; echo "Body:"; cat "$BODY"; echo
          STATUS=$(jq -r 'if type == "object" then (.status // "__khong_co_truong__") else "__khong_phai_object__" end' "$BODY" 2>/dev/null || echo "__khong_phai_json__")
          if [ "$CODE" = "200" ] && [ "$STATUS" = "" ]; then
            echo "Chưa có Pages deployment cho sha này — được phép phát hành."
          elif [ "$CODE" = "200" ] && [ -n "$STATUS" ] && [ "${STATUS#__}" = "$STATUS" ]; then
            echo "::error::Commit $GITHUB_SHA ĐÃ có Pages deployment (status=$STATUS). Tag đang trỏ vào commit đã lên main sau merge? Tạo nhánh mới + commit rỗng + tag v* mới (docs/kien-truc.md mục 7)."; exit 1
          else
            echo "::error::Phản hồi ngoài dự kiến (HTTP $CODE, status=$STATUS) — không tự cho qua. Kiểm tra lại API/quyền rồi chạy lại."; exit 1
          fi

  phat-hanh:
    name: Backup + migration production + build (chờ duyệt)
    needs: kiem-tra
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://haidang21ktvptu.github.io/vptu-mvp-task/
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Kiểm tra secrets
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD PASSPHRASE; do
            if [ -z "${!v}" ]; then echo "::error::Thiếu secret cho $v (xem docs/kien-truc.md)."; exit 1; fi
          done

      # Cùng script với backup-dinh-ky.yml (một nguồn duy nhất). Login role qua token nên không cần -p;
      # passphrase đi qua env → fd, không qua tham số. Tên artifact vẫn prod-<ngày>-<tag>.
      - name: Backup production bằng scripts/backup-db.sh (schema + data, AES-256)
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          FILE=$(bash scripts/backup-db.sh --project-ref "$PROD_REF" --nhan "$GITHUB_REF_NAME" --thu-muc backup 2> backup.log) \
            || { cat backup.log; echo "::error::backup-db.sh thất bại — production chưa đổi gì."; exit 1; }
          NAME=$(basename "$FILE" .tar.gz.gpg)
          echo "BACKUP_NAME=$NAME" >> "$GITHUB_ENV"
          { echo "### Backup $NAME"; echo '```'; grep -vE '^(Dumping|Dumped|Initialising|Connecting)' backup.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat backup.log
      - name: Lưu backup thành artifact (90 ngày)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_NAME }}
          path: backup/${{ env.BACKUP_NAME }}.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error

      - name: supabase db push (production)
        run: |
          echo "### Migration production (${{ github.ref_name }})" >> "$GITHUB_STEP_SUMMARY"
          supabase db push --project-ref "$PROD_REF" -p "$SUPABASE_DB_PASSWORD" --dry-run 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          supabase db push --project-ref "$PROD_REF" -p "$SUPABASE_DB_PASSWORD" --yes

      - uses: ./.github/actions/build-pages-site
        with:
          prod-ref: ${{ github.sha }}
          prod-version: ${{ github.ref_name }}
          prod-url: ${{ secrets.VITE_SUPABASE_URL }}
          prod-anon-key: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          staging-ref: main
          staging-url: ${{ env.STAGING_URL }}
          staging-anon-key: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}

  deploy:
    name: Deploy Pages
    needs: phat-hanh
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Smoke test bản live + gắn tag production
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Đợi bản ${{ github.ref_name }} lan tới Pages (tối đa 3 phút)
        run: |
          for i in $(seq 1 18); do
            if curl -fsS "${LIVE_URL}phien-ban.json" | grep -q '"${{ github.ref_name }}"'; then
              curl -fsS "${LIVE_URL}phien-ban.json"; exit 0
            fi
            sleep 10
          done
          echo "::error::Sau 3 phút ${LIVE_URL}phien-ban.json vẫn chưa ghi ${{ github.ref_name }}"
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Đăng nhập 1 tài khoản trên bản live (Playwright)
        working-directory: tests/e2e
        env:
          SMOKE_URL: ${{ env.LIVE_URL }}
          SMOKE_USERNAME: ${{ secrets.SMOKE_USERNAME }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: |
          if [ -z "$SMOKE_USERNAME" ] || [ -z "$SMOKE_PASSWORD" ]; then
            echo "::error::Thiếu secret SMOKE_USERNAME / SMOKE_PASSWORD."; exit 1
          fi
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test -c playwright.smoke.config.js
      - name: Lưu báo cáo smoke khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: tests/e2e/playwright-report-smoke
          retention-days: 7
      - name: Gắn tag `production` vào commit vừa phát hành
        run: |
          git tag -f production "${{ github.sha }}"
          git push --force origin refs/tags/production
          echo "Đã phát hành ${{ github.ref_name }} (${{ github.sha }}) — tag production cập nhật." >> "$GITHUB_STEP_SUMMARY"

  quay-lui:
    name: Hướng dẫn quay lui (chỉ khi lỗi)
    if: failure()
    needs: [kiem-tra, phat-hanh, deploy, smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Ghi hướng dẫn vào Summary
        env:
          R0: ${{ needs.kiem-tra.result }}
          R1: ${{ needs.phat-hanh.result }}
          R2: ${{ needs.deploy.result }}
          R3: ${{ needs.smoke.result }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "## Phát hành $TAG THẤT BẠI — cách quay lui"
            echo "Kết quả: kiem-tra=$R0, phat-hanh=$R1, deploy=$R2, smoke=$R3."
            echo
            if [ "$R0" != "success" ]; then
              echo "- **Tag bị chặn ở bước kiểm tra** (CI chưa xanh hoặc commit đã deploy Pages). Production CHƯA đổi gì. Sửa theo thông báo của job *kiem-tra* rồi tag lại lên commit hợp lệ (docs/kien-truc.md mục 7)."
            elif [ "$R1" != "success" ]; then
              echo "- **Lỗi ở bước backup/migration/build.** Xem log job *phat-hanh*: nếu dừng trước 'supabase db push' thì production CHƯA đổi gì; tag production vẫn trỏ bản cũ, bản live không đổi."
              echo "- Nếu 'db push' đã chạy một phần: kiểm tra \`supabase migration list --project-ref frwyxcmbonjaimziiuqr\` rồi quyết định sửa tiến (migration mới) hoặc khôi phục từ backup artifact của lần chạy này (docs/kien-truc.md mục Quay lui)."
            elif [ "$R2" != "success" ]; then
              echo "- **Migration đã áp, frontend chưa lên.** Bản live vẫn là bản cũ (thường vẫn chạy được vì migration chỉ thêm). Chạy lại job *deploy* (Re-run failed jobs) hoặc đẩy lại tag."
            else
              echo "- **Frontend mới đã lên nhưng smoke test lỗi.** Quay lui frontend: KHÔNG tag lại commit cũ (sha đã deploy, Pages bỏ qua). Làm: \`git checkout -b hotfix/quay-lui <commit cũ> && git commit --allow-empty -m 'Quay lui về v<cũ>' && git push -u origin HEAD && git tag v<mới> && git push origin v<mới>\` → deploy-prod chạy lại (chờ duyệt; migration không áp gì thêm) → mở PR nhánh đó, merge sau."
              echo "- Nếu lỗi do dữ liệu/migration: tải artifact backup của lần chạy này, giải mã \`gpg -d --batch --pinentry-mode loopback --passphrase <BACKUP_PASSPHRASE> <file>.tar.gz.gpg | tar xz\`, rồi khôi phục theo hướng dẫn GĐ7 (scripts/restore-db.sh) — dữ liệu ghi sau lúc backup sẽ mất, chỉ làm khi không sửa tiến được."
            fi
            echo
            echo "Xem docs/kien-truc.md mục 'Quay lui'."
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          echo "::error::Phát hành $TAG thất bại — xem Summary để quay lui."
