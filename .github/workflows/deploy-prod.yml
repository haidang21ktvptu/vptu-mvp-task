# Phát hành production khi đẩy tag v* (ví dụ v2.0.0-rc1). Thứ tự:
#   1. `phat-hanh` (environment "production", CHỜ NGƯỜI DUYỆT haidang21ktvptu):
#      backup pg_dump production (mã hoá, lưu artifact 90 ngày) → supabase db push production
#      → build hai bản frontend (production từ tag, staging từ main).
#   2. `deploy`: đưa artifact lên GitHub Pages (migration đã xong TRƯỚC — bài học GĐ1).
#   3. `smoke`: đợi bản mới lan tới Pages, đăng nhập 1 tài khoản bằng Playwright; đạt thì gắn tag
#      `production` vào commit vừa phát hành (deploy-staging dùng tag này để build lại bản production).
#   4. `quay-lui`: chỉ chạy khi có bước lỗi — ghi hướng dẫn quay lui vào Summary.
# Không có workflow_dispatch: production luôn = một tag v*; quay lui = gắn tag v* mới cao hơn trỏ vào
# commit cũ (xem docs/kien-truc.md). Cấu hình Auth (supabase config push) vẫn làm tay sau khi trình diff.
#
# Secrets: repository — SUPABASE_ACCESS_TOKEN, VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY,
# STAGING_SUPABASE_ANON_KEY, SMOKE_USERNAME, SMOKE_PASSWORD; environment "production" —
# PROD_DB_PASSWORD, BACKUP_PASSPHRASE. Chi tiết: docs/kien-truc.md.
name: Deploy production

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PROD_REF: frwyxcmbonjaimziiuqr
  STAGING_URL: https://vojmrjezspdftovzinek.supabase.co
  LIVE_URL: https://haidang21ktvptu.github.io/vptu-mvp-task/

# shell: bash để bật pipefail — lỗi trong lệnh trước dấu | (db dump, db push --dry-run) không bị nuốt.
defaults:
  run:
    shell: bash

jobs:
  phat-hanh:
    name: Backup + migration production + build (chờ duyệt)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://haidang21ktvptu.github.io/vptu-mvp-task/
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Kiểm tra secrets
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD PASSPHRASE; do
            if [ -z "${!v}" ]; then echo "::error::Thiếu secret cho $v (xem docs/kien-truc.md)."; exit 1; fi
          done

      - name: Backup pg_dump production (schema + data), mã hoá AES-256
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          mkdir -p backup
          supabase db dump --project-ref "$PROD_REF" -p "$SUPABASE_DB_PASSWORD" -f backup/schema.sql
          supabase db dump --project-ref "$PROD_REF" -p "$SUPABASE_DB_PASSWORD" --data-only -f backup/data.sql
          NAME="prod-$(date -u +%Y%m%d-%H%M)-${{ github.ref_name }}"
          echo "BACKUP_NAME=$NAME" >> "$GITHUB_ENV"
          tar czf - -C backup schema.sql data.sql \
            | gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 --passphrase "$PASSPHRASE" -o "$NAME.tar.gz.gpg"
          rm -rf backup
          ls -l "$NAME.tar.gz.gpg"
      - name: Lưu backup thành artifact (90 ngày)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_NAME }}
          path: ${{ env.BACKUP_NAME }}.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error

      - name: supabase db push (production)
        run: |
          echo "### Migration production (${{ github.ref_name }})" >> "$GITHUB_STEP_SUMMARY"
          supabase db push --project-ref "$PROD_REF" -p "$SUPABASE_DB_PASSWORD" --dry-run 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          supabase db push --project-ref "$PROD_REF" -p "$SUPABASE_DB_PASSWORD" --yes

      - uses: ./.github/actions/build-pages-site
        with:
          prod-ref: ${{ github.sha }}
          prod-version: ${{ github.ref_name }}
          prod-url: ${{ secrets.VITE_SUPABASE_URL }}
          prod-anon-key: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          staging-ref: main
          staging-url: ${{ env.STAGING_URL }}
          staging-anon-key: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}

  deploy:
    name: Deploy Pages
    needs: phat-hanh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Smoke test bản live + gắn tag production
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Đợi bản ${{ github.ref_name }} lan tới Pages (tối đa 3 phút)
        run: |
          for i in $(seq 1 18); do
            if curl -fsS "${LIVE_URL}phien-ban.json" | grep -q '"${{ github.ref_name }}"'; then
              curl -fsS "${LIVE_URL}phien-ban.json"; exit 0
            fi
            sleep 10
          done
          echo "::error::Sau 3 phút ${LIVE_URL}phien-ban.json vẫn chưa ghi ${{ github.ref_name }}"
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Đăng nhập 1 tài khoản trên bản live (Playwright)
        working-directory: tests/e2e
        env:
          SMOKE_URL: ${{ env.LIVE_URL }}
          SMOKE_USERNAME: ${{ secrets.SMOKE_USERNAME }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: |
          if [ -z "$SMOKE_USERNAME" ] || [ -z "$SMOKE_PASSWORD" ]; then
            echo "::error::Thiếu secret SMOKE_USERNAME / SMOKE_PASSWORD."; exit 1
          fi
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test -c playwright.smoke.config.js
      - name: Lưu báo cáo smoke khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: tests/e2e/playwright-report-smoke
          retention-days: 7
      - name: Gắn tag `production` vào commit vừa phát hành
        run: |
          git tag -f production "${{ github.sha }}"
          git push --force origin refs/tags/production
          echo "Đã phát hành ${{ github.ref_name }} (${{ github.sha }}) — tag production cập nhật." >> "$GITHUB_STEP_SUMMARY"

  quay-lui:
    name: Hướng dẫn quay lui (chỉ khi lỗi)
    if: failure()
    needs: [phat-hanh, deploy, smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Ghi hướng dẫn vào Summary
        env:
          R1: ${{ needs.phat-hanh.result }}
          R2: ${{ needs.deploy.result }}
          R3: ${{ needs.smoke.result }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "## Phát hành $TAG THẤT BẠI — cách quay lui"
            echo "Kết quả: phat-hanh=$R1, deploy=$R2, smoke=$R3."
            echo
            if [ "$R1" != "success" ]; then
              echo "- **Lỗi ở bước backup/migration/build.** Xem log job *phat-hanh*: nếu dừng trước 'supabase db push' thì production CHƯA đổi gì; tag production vẫn trỏ bản cũ, bản live không đổi."
              echo "- Nếu 'db push' đã chạy một phần: kiểm tra \`supabase migration list --project-ref frwyxcmbonjaimziiuqr\` rồi quyết định sửa tiến (migration mới) hoặc khôi phục từ backup artifact của lần chạy này (docs/kien-truc.md mục Quay lui)."
            elif [ "$R2" != "success" ]; then
              echo "- **Migration đã áp, frontend chưa lên.** Bản live vẫn là bản cũ (thường vẫn chạy được vì migration chỉ thêm). Chạy lại job *deploy* (Re-run failed jobs) hoặc đẩy lại tag."
            else
              echo "- **Frontend mới đã lên nhưng smoke test lỗi.** Quay lui frontend: gắn tag v* mới cao hơn trỏ vào commit production cũ, ví dụ \`git tag v<mới> production && git push origin v<mới>\` (deploy-prod chạy lại, chờ duyệt; migration không áp gì thêm vì đã có)."
              echo "- Nếu lỗi do dữ liệu/migration: tải artifact backup của lần chạy này, giải mã \`gpg -d --batch --pinentry-mode loopback --passphrase <BACKUP_PASSPHRASE> <file>.tar.gz.gpg | tar xz\`, rồi khôi phục theo hướng dẫn GĐ7 (scripts/restore-db.sh) — dữ liệu ghi sau lúc backup sẽ mất, chỉ làm khi không sửa tiến được."
            fi
            echo
            echo "Xem docs/kien-truc.md mục 'Quay lui'."
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          echo "::error::Phát hành $TAG thất bại — xem Summary để quay lui."
