# Mỗi lần push main (trừ push chỉ đổi docs/*.md/workflow backup, cảnh báo — job phan-loai): áp migration lên STAGING → (test RLS token thật ‖ build hai bản frontend) → deploy GitHub Pages.
# Migration luôn chạy TRƯỚC deploy frontend (bài học GĐ1: frontend mới gọi hàm chưa có trong DB).
# Test RLS bằng token thật (7 tài khoản seed) chuyển từ ci.yml sang đây để chạy SAU db push — tức trên
# schema staging đã có migration mới; trong PR, RLS đã chạy trên Supabase cục bộ (job supabase-db).
# Job RLS đỏ không chặn deploy (build/deploy không `needs` nó) nhưng làm cả run đỏ — đọc theo từng job:
# deploy xanh + RLS đỏ = staging đã lên, RLS cần sửa ở PR kế; staging phải luôn phản ánh main để tra lỗi.
#
# Pages chỉ có một site nên artifact gồm cả hai bản (xem .github/actions/build-pages-site):
#   /vptu-mvp-task/          production — build lại từ tag `production` (commit đã phát hành gần nhất,
#                            do deploy-prod.yml gắn sau khi smoke test đạt); chưa có tag thì lấy main.
#   /vptu-mvp-task/staging/  staging — build từ main, trỏ project Supabase staging.
# Pages bắt pages_build_version = sha của commit chạy workflow (OIDC), mỗi sha chỉ deploy được một lần
# (kết luận chẩn đoán GĐ6) — mỗi push main là một sha mới nên ở đây không thành vấn đề; re-run cùng
# commit sẽ "thành công" mà không đổi gì.
#
# Secrets (Settings → Secrets and variables → Actions, repository): SUPABASE_ACCESS_TOKEN,
# STAGING_DB_PASSWORD, STAGING_SUPABASE_ANON_KEY, STAGING_SUPABASE_SERVICE_ROLE_KEY (job RLS dọn dữ liệu test),
# VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY (hai secret VITE_* là của production, chỉ anon key). Chi tiết: docs/kien-truc.md.
name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Cùng nhóm với deploy-prod để hai workflow không ghi đè artifact Pages của nhau; không huỷ lượt đang chạy.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  STAGING_REF: vojmrjezspdftovzinek
  STAGING_URL: https://vojmrjezspdftovzinek.supabase.co

# shell: bash để bật pipefail — lỗi trong lệnh trước dấu | (db dump, db push --dry-run) không bị nuốt.
defaults:
  run:
    shell: bash

jobs:
  # Push main chỉ đổi docs/**, *.md, workflows backup-dinh-ky / canh-bao (script dùng chung .github/scripts/phan-loai.sh, cùng ci.yml) →
  # không có gì để áp/dựng: bỏ qua cả run (các job sau `needs: migration` bỏ qua theo). workflow_dispatch luôn chạy đủ. Không đọc được
  # danh sách file / push đầu tiên → chạy đủ. Không đụng artifact Pages (chỉ bỏ qua khi bản staging không đổi; bản production do deploy-prod).
  phan-loai:
    name: Phân loại thay đổi (không ảnh hưởng app?)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      khong_anh_huong_app: ${{ steps.xet.outputs.khong_anh_huong_app }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
      - id: xet
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: bash .github/scripts/phan-loai.sh

  migration:
    name: Áp migration lên staging
    needs: phan-loai
    if: ${{ github.event_name == 'workflow_dispatch' || needs.phan-loai.outputs.khong_anh_huong_app != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Kiểm tra secrets
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PW: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$PW" ]; then
            echo "::error::Thiếu secret SUPABASE_ACCESS_TOKEN / STAGING_DB_PASSWORD (xem docs/kien-truc.md)."
            exit 1
          fi
      - name: supabase db push (staging)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          supabase db push --project-ref "$STAGING_REF" -p "$SUPABASE_DB_PASSWORD" --dry-run
          supabase db push --project-ref "$STAGING_REF" -p "$SUPABASE_DB_PASSWORD" --yes
          echo "### Migration staging" >> "$GITHUB_STEP_SUMMARY"
          supabase migration list --project-ref "$STAGING_REF" -p "$SUPABASE_DB_PASSWORD" >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
      # Edge Function quan-tri-tai-khoan (GĐ23): service_role chỉ nằm trong secrets của function (Supabase cấp sẵn), deploy cùng lượt với migration.
      - name: supabase functions deploy (staging)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy quan-tri-tai-khoan --project-ref "$STAGING_REF" --use-api

  # RLS bằng token thật trên staging (7 lượt đăng nhập, dưới giới hạn 30 lượt/5 phút/IP), sau khi migration
  # đã áp. Chạy song song với build; không chặn deploy. Cùng nhóm concurrency với job e2e của ci.yml để không
  # ghi dữ liệu mẫu lên staging cùng lúc với một PR đang kiểm thử.
  kiem-thu-rls:
    name: Test RLS trên staging (token thật)
    needs: migration
    runs-on: ubuntu-latest
    concurrency:
      group: kiem-thu-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/rls/package-lock.json
      # env ở cấp bước để dùng được STAGING_URL của workflow (cấp job không đọc được context `env`).
      - name: Test RLS (token thật, 7 tài khoản seed)
        working-directory: tests/rls
        env:
          SUPABASE_URL: ${{ env.STAGING_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Thiếu secret STAGING_SUPABASE_ANON_KEY / STAGING_SUPABASE_SERVICE_ROLE_KEY (xem docs/kien-truc.md)."
            exit 1
          fi
          npm ci && npm test

  build:
    name: Build hai bản frontend
    needs: migration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Xác định commit production đang phát hành (tag `production`)
        id: prod
        run: |
          git fetch --force origin '+refs/tags/production:refs/tags/production' 2>/dev/null || true
          if git rev-parse -q --verify refs/tags/production^{commit} >/dev/null; then
            SHA=$(git rev-parse refs/tags/production^{commit})
            git fetch --tags --force origin >/dev/null 2>&1 || true
            VERSION=$(git tag --points-at "$SHA" -l 'v*' | sort -V | tail -n1)
            echo "ref=$SHA" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION:-$SHA}" >> "$GITHUB_OUTPUT"
            echo "Production = tag production → $SHA (${VERSION:-chưa có tag v*})"
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "version=main@${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "::warning::Chưa có tag production (chưa phát hành lần nào qua deploy-prod) — bản production build từ main như trước GĐ6."
          fi
      - name: Kiểm tra secrets build
        env:
          A: ${{ secrets.VITE_SUPABASE_URL }}
          B: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          C: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$A" ] || [ -z "$B" ] || [ -z "$C" ]; then
            echo "::error::Thiếu secret VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY / STAGING_SUPABASE_ANON_KEY."
            exit 1
          fi
      - uses: ./.github/actions/build-pages-site
        with:
          prod-ref: ${{ steps.prod.outputs.ref }}
          prod-version: ${{ steps.prod.outputs.version }}
          prod-url: ${{ secrets.VITE_SUPABASE_URL }}
          prod-anon-key: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          staging-ref: ${{ github.sha }}
          staging-url: ${{ env.STAGING_URL }}
          staging-anon-key: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}

  deploy:
    name: Deploy Pages (staging + production giữ nguyên)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}staging/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Kiểm tra bản staging đã lên
        run: |
          URL="${{ steps.deployment.outputs.page_url }}staging/phien-ban.json"
          for i in $(seq 1 18); do
            if curl -fsS "$URL" | grep -q "${{ github.sha }}"; then echo "Staging đã lên: $URL"; exit 0; fi
            sleep 10
          done
          echo "::error::Sau 3 phút bản staging vẫn chưa thấy commit ${{ github.sha }} tại $URL"
          exit 1
