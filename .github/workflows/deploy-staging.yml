# Mỗi lần push main: áp migration lên STAGING → build hai bản frontend → deploy GitHub Pages.
# Migration luôn chạy TRƯỚC deploy frontend (bài học GĐ1: frontend mới gọi hàm chưa có trong DB).
#
# Pages chỉ có một site nên artifact gồm cả hai bản (xem .github/actions/build-pages-site):
#   /vptu-mvp-task/          production — build lại từ tag `production` (commit đã phát hành gần nhất,
#                            do deploy-prod.yml gắn sau khi smoke test đạt); chưa có tag thì lấy main.
#   /vptu-mvp-task/staging/  staging — build từ main, trỏ project Supabase staging.
# Deploy bằng .github/actions/deploy-pages-versioned với pages_build_version = main-<sha>-<run_id>-<run_attempt>
# (actions/deploy-pages dùng GITHUB_SHA làm version nên re-run/tag cùng commit bị GitHub bỏ qua).
#
# Secrets (Settings → Secrets and variables → Actions, repository): SUPABASE_ACCESS_TOKEN,
# STAGING_DB_PASSWORD, STAGING_SUPABASE_ANON_KEY, VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
# (hai secret VITE_* là của production, chỉ anon key). Chi tiết: docs/kien-truc.md.
name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Cùng nhóm với deploy-prod để hai workflow không ghi đè artifact Pages của nhau; không huỷ lượt đang chạy.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  STAGING_REF: vojmrjezspdftovzinek
  STAGING_URL: https://vojmrjezspdftovzinek.supabase.co

# shell: bash để bật pipefail — lỗi trong lệnh trước dấu | (db dump, db push --dry-run) không bị nuốt.
defaults:
  run:
    shell: bash

jobs:
  migration:
    name: Áp migration lên staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Kiểm tra secrets
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PW: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$PW" ]; then
            echo "::error::Thiếu secret SUPABASE_ACCESS_TOKEN / STAGING_DB_PASSWORD (xem docs/kien-truc.md)."
            exit 1
          fi
      - name: supabase db push (staging)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          supabase db push --project-ref "$STAGING_REF" -p "$SUPABASE_DB_PASSWORD" --dry-run
          supabase db push --project-ref "$STAGING_REF" -p "$SUPABASE_DB_PASSWORD" --yes
          echo "### Migration staging" >> "$GITHUB_STEP_SUMMARY"
          supabase migration list --project-ref "$STAGING_REF" -p "$SUPABASE_DB_PASSWORD" >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

  build:
    name: Build hai bản frontend
    needs: migration
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.site.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - name: Xác định commit production đang phát hành (tag `production`)
        id: prod
        run: |
          git fetch --force origin '+refs/tags/production:refs/tags/production' 2>/dev/null || true
          if git rev-parse -q --verify refs/tags/production^{commit} >/dev/null; then
            SHA=$(git rev-parse refs/tags/production^{commit})
            git fetch --tags --force origin >/dev/null 2>&1 || true
            VERSION=$(git tag --points-at "$SHA" -l 'v*' | sort -V | tail -n1)
            echo "ref=$SHA" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION:-$SHA}" >> "$GITHUB_OUTPUT"
            echo "Production = tag production → $SHA (${VERSION:-chưa có tag v*})"
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "version=main@${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "::warning::Chưa có tag production (chưa phát hành lần nào qua deploy-prod) — bản production build từ main như trước GĐ6."
          fi
      - name: Kiểm tra secrets build
        env:
          A: ${{ secrets.VITE_SUPABASE_URL }}
          B: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          C: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$A" ] || [ -z "$B" ] || [ -z "$C" ]; then
            echo "::error::Thiếu secret VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY / STAGING_SUPABASE_ANON_KEY."
            exit 1
          fi
      - uses: ./.github/actions/build-pages-site
        id: site
        with:
          prod-ref: ${{ steps.prod.outputs.ref }}
          prod-version: ${{ steps.prod.outputs.version }}
          prod-url: ${{ secrets.VITE_SUPABASE_URL }}
          prod-anon-key: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          staging-ref: ${{ github.sha }}
          staging-url: ${{ env.STAGING_URL }}
          staging-anon-key: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}

  deploy:
    name: Deploy Pages (staging + production giữ nguyên)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}staging/
    steps:
      - uses: actions/checkout@v4
      - id: deployment
        uses: ./.github/actions/deploy-pages-versioned
        with:
          artifact-id: ${{ needs.build.outputs.artifact_id }}
          version: main-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Kiểm tra bản staging đã lên
        run: |
          URL="${{ steps.deployment.outputs.page_url }}staging/phien-ban.json"
          for i in $(seq 1 18); do
            if curl -fsS "$URL" | grep -q "${{ github.sha }}"; then echo "Staging đã lên: $URL"; exit 0; fi
            sleep 10
          done
          echo "::error::Sau 3 phút bản staging vẫn chưa thấy commit ${{ github.sha }} tại $URL"
          exit 1
